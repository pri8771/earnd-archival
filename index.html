<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archival Video Library</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #141420;
    --border: #2a2a3e;
    --text: #e0e0f0;
    --muted: #8888aa;
    --accent: #6c5ce7;
    --accent-hover: #8577ed;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 24px 32px;
  }
  header h1 {
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .filters {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filters input, .filters select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 0.9rem;
    outline: none;
  }
  .filters input:focus, .filters select:focus {
    border-color: var(--accent);
  }
  #search-input { flex: 1; min-width: 200px; }
  .main { padding: 24px 32px; max-width: 1200px; margin: 0 auto; }
  .video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 20px;
  }
  .video-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    transition: transform 0.15s, border-color 0.15s;
  }
  .video-card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
  }
  .video-embed {
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .video-embed iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
  .video-info { padding: 14px 16px; }
  .video-title {
    font-size: 0.95rem;
    font-weight: 600;
    margin-bottom: 6px;
    line-height: 1.3;
  }
  .video-desc {
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 10px;
    line-height: 1.4;
  }
  .video-meta {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .tag {
    background: rgba(108,92,231,0.15);
    color: var(--accent-hover);
    padding: 3px 9px;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 500;
  }
  .date-badge {
    color: var(--muted);
    font-size: 0.75rem;
  }
  .creator-badge {
    color: var(--muted);
    font-size: 0.75rem;
  }
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 1.1rem;
  }
  footer {
    text-align: center;
    padding: 24px;
    color: var(--muted);
    font-size: 0.8rem;
    border-top: 1px solid var(--border);
    margin-top: 40px;
  }
</style>
</head>
<body>

<header>
  <h1>&#x1F39E; Archival Video Library</h1>
  <div class="filters">
    <input type="text" id="search-input" placeholder="Search videos, creators...">
    <select id="filter-tag"><option value="">All Tags</option></select>
    <select id="filter-creator"><option value="">All Creators</option></select>
    <input type="date" id="filter-date">
  </div>
</header>

<div class="main">
  <div id="video-grid" class="video-grid"></div>
  <div id="empty-state" class="empty-state" style="display:none;">No videos match your filters.</div>
</div>

<footer>Archival Video Library &mdash; Curated collection of preserved media.</footer>

<script>
// ============================================================
// CONFIGURATION: Add videos here. Videos are embedded/linked,
// not hosted on this site. Just edit this array and redeploy.
// ============================================================
const VIDEOS = [
  {
    id: "sample-1",
    title: "Sample Archival Clip — Historical Footage",
    description: "A sample video entry demonstrating the archival library layout.",
    embedUrl: "",  // e.g. https://youtube.com/embed/VIDEO_ID or any iframe src
    linkUrl: "",   // optional: link to original source
    date: "2024-01-15",
    creator: "Archive Team",
    tags: ["history", "documentary"]
  }
];

// ============================================================
// RENDERING LOGIC — no framework needed
// ============================================================
function render() {
  const search = document.getElementById('search-input').value.toLowerCase();
  const tagFilter = document.getElementById('filter-tag').value;
  const creatorFilter = document.getElementById('filter-creator').value;
  const dateFilter = document.getElementById('filter-date').value;

  // Populate filter dropdowns
  const allTags = [...new Set(VIDEOS.flatMap(v => v.tags))].sort();
  const allCreators = [...new Set(VIDEOS.map(v => v.creator))].sort();
  populateSelect('filter-tag', allTags);
  populateSelect('filter-creator', allCreators);

  const filtered = VIDEOS.filter(v => {
    if (search && !(v.title + ' ' + v.description + ' ' + v.creator + ' ' + v.tags.join(' ')).toLowerCase().includes(search)) return false;
    if (tagFilter && !v.tags.includes(tagFilter)) return false;
    if (creatorFilter && v.creator !== creatorFilter) return false;
    if (dateFilter && v.date < dateFilter) return false;
    return true;
  });

  const grid = document.getElementById('video-grid');
  const empty = document.getElementById('empty-state');

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }

  empty.style.display = 'none';
  grid.innerHTML = filtered.map(v => `
    <div class="video-card">
      ${v.embedUrl ? `<div class="video-embed"><iframe src="${esc(v.embedUrl)}" allowfullscreen loading="lazy"></iframe></div>` : '<div class="video-embed"><span style="color:var(--muted);font-size:2rem;">&#x1F3AC;</span></div>'}
      <div class="video-info">
        <div class="video-title">${esc(v.title)}</div>
        ${v.description ? `<div class="video-desc">${esc(v.description)}</div>` : ''}
        <div class="video-meta">
          ${v.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}
          <span class="date-badge">${v.date}</span>
          ${v.creator ? `<span class="creator-badge">by ${esc(v.creator)}</span>` : ''}
        </div>
      </div>
    </div>
  `).join('');
}

function populateSelect(id, items) {
  const sel = document.getElementById(id);
  const current = sel.value;
  sel.innerHTML = '<option value="">All ' + id.split('-').pop().replace('filter-','') + 's</option>';
  items.forEach(i => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = i;
    sel.appendChild(opt);
  });
  sel.value = current;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

document.getElementById('search-input').addEventListener('input', render);
document.getElementById('filter-tag').addEventListener('change', render);
document.getElementById('filter-creator').addEventListener('change', render);
document.getElementById('filter-date').addEventListener('change', render);

render();
</script>
</body>
</html>
